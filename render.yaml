services:
  - type: web
    name: portfolio
    runtime: python
    region: singapore          # closest free region to India
    plan: free
    rootDir: .
    buildCommand: |
      cd frontend && npm ci && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_DEBUG
        value: false
      - key: FRONTEND_ORIGINS
        value: ""              # not needed — backend serves the SPA directly
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false            # set manually in Render dashboard
      - key: SMTP_PASSWORD
        sync: false            # set manually in Render dashboard (App Password)
      - key: CONTACT_TO_EMAIL
        sync: false
      - key: CONTACT_FROM_EMAIL
        sync: false
      - key: CONTACT_RATE_LIMIT
        value: "3"
      - key: CONTACT_RATE_WINDOW_SECONDS
        value: "600"
